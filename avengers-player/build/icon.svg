<?xml version="1.0" encoding="UTF-8"?>
<!--
  Avengers Player app icon. Original artwork: a dark navy tile with a glowing
  ring glyph (three concentric cyan rings, the middle one cut into eight
  segments) and a small gold four-point spark in the centre.

  This file is the master. build/icon.png (512x512) and build/icon.ico
  (16, 24, 32, 48, 64, 128, 256) are rendered from it with Chromium. Small
  sizes cannot carry hairline detail, so the renderer adds one class to the
  root element and the style block below simplifies the drawing:
    size-48  (48 px)       no hairline ring, fatter strokes
    size-32  (32 px)       as above, a little bolder again
    size-24  (24 px)       full-bleed tile, one bold segmented ring + spark
    size-16  (16 px)       full-bleed tile, four chunky segments + spark
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tileFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1b33"/>
      <stop offset="1" stop-color="#060b16"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5fe3ff" stop-opacity="0.22"/>
      <stop offset="0.6" stop-color="#5fe3ff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#5fe3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sparkHalo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6c453" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f6c453" stop-opacity="0"/>
    </radialGradient>
    <!-- Blur the glyph, fade the blur, then draw the sharp glyph on top. -->
    <filter id="ringGlow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feComponentTransfer in="blur" result="soft">
        <feFuncA type="linear" slope="0.6"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="soft"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="sparkGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .ring { fill: none; stroke: #5fe3ff; }
      #outerRing { stroke-width: 16; }
      #segmentRing { stroke-width: 36; }
      #innerRing { stroke-width: 7; }
      #segments, #spark { transform-origin: 256px 256px; }

      .size-48 #innerRing, .size-32 #innerRing { display: none; }
      .size-48 #outerRing { stroke-width: 22; }
      .size-48 #segmentRing { stroke-width: 42; }
      .size-48 #spark { transform: scale(1.2); }

      .size-32 #tileEdge { display: none; }
      .size-32 #outerRing { stroke-width: 26; }
      .size-32 #segmentRing { stroke-width: 46; }
      .size-32 #spark { transform: scale(1.3); }

      /* At 24 and 16 px the 16-unit margin is half a pixel of blur, so the tile bleeds to the edge. */
      .size-24 #tile, .size-16 #tile { x: 0; y: 0; width: 512px; height: 512px; rx: 100px; }
      .size-24 #tileEdge, .size-16 #tileEdge,
      .size-24 #outerRing, .size-16 #outerRing,
      .size-24 #innerRing, .size-16 #innerRing { display: none; }

      .size-24 #segmentRing { stroke-width: 64; }
      .size-24 #segments { transform: scale(1.3); }
      .size-24 #spark { transform: scale(1.6); }

      /* Eight segments turn to mush at 16 px; four with the gaps on the pixel axes stay crisp. */
      .size-16 #segmentRing { stroke-width: 72; stroke-dasharray: 150.779 44; transform: rotate(10.165deg); transform-origin: 256px 256px; }
      .size-16 #segments { transform: scale(1.28); }
      .size-16 #spark { transform: scale(1.75); }
    </style>
  </defs>

  <!-- Tile -->
  <rect id="tile" x="16" y="16" width="480" height="480" rx="108" fill="url(#tileFill)"/>
  <rect id="tileEdge" x="19" y="19" width="474" height="474" rx="105" fill="none"
        stroke="#5fe3ff" stroke-opacity="0.2" stroke-width="6"/>

  <!-- Soft light behind the glyph -->
  <circle cx="256" cy="256" r="226" fill="url(#halo)"/>

  <!-- Ring glyph -->
  <g filter="url(#ringGlow)">
    <circle id="outerRing" class="ring" cx="256" cy="256" r="178"/>
    <!--
      r = 124 gives a circumference of 779.115, so eight equal periods of
      97.389: a 69.389 dash and a 28 gap. The rotation centres the first dash
      on the 3 o'clock axis, which makes the eight segments sit symmetrically.
    -->
    <g id="segments">
      <circle id="segmentRing" class="ring" cx="256" cy="256" r="124"
              stroke-dasharray="69.389 28" transform="rotate(-16.031 256 256)"/>
    </g>
    <circle id="innerRing" class="ring" cx="256" cy="256" r="82" stroke-opacity="0.85"/>
  </g>

  <!-- Gold spark -->
  <circle cx="256" cy="256" r="72" fill="url(#sparkHalo)"/>
  <g filter="url(#sparkGlow)">
    <path id="spark" fill="#f6c453"
          d="M256 200 Q262 250 312 256 Q262 262 256 312 Q250 262 200 256 Q250 250 256 200 Z"/>
  </g>
</svg>
